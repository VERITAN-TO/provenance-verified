name: PV Native Route 2 Dispatch — DORMANT RECOVERY ONLY

# Preserved, not deleted. Route 2 may not execute concurrently with Route 1.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dormant:
    runs-on: ubuntu-latest
    steps:
      - name: Route 2 dormant receipt
        run: |
          echo "PV_ROUTE_2_STATE=DORMANT"
          echo "PV_ACTIVE_EXECUTION_ROUTE=ROUTE_1"
          echo "RECOVERY_ACTIVATION_REQUIRES_EXPLICIT_CTO_ROUTE_SWITCH=YES"
          echo "NO_LANE_DISPATCH_PERFORMED=YES"
