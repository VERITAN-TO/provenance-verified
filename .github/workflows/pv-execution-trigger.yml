name: PV PEACP Native Fallback Dispatch

# PEACP v1.2: native persistent-session PR subscription is the PRIMARY wake path.
# This workflow is fallback-only for explicit recovery dispatch.
on:
  repository_dispatch:
    types: [pv-lane-wake]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit Lane C fallback dispatch
        shell: bash
        run: |
          set -euo pipefail
          lane="$(jq -r '.client_payload.lane // ""' "$GITHUB_EVENT_PATH")"
          pr="$(jq -r '.client_payload.pr // 0' "$GITHUB_EVENT_PATH")"
          reason="$(jq -r '.client_payload.reason // ""' "$GITHUB_EVENT_PATH")"

          if [ "$lane" != "C" ] || [ "$pr" != "3" ] || [ -z "$reason" ]; then
            echo "Fallback dispatch rejected"
            exit 1
          fi

          echo "PEACP_FALLBACK_DISPATCH lane=C pr=3"
          echo "Native persistent-session PR subscription remains primary."
          echo "This workflow does not create or replace a persistent Code-agent session."
