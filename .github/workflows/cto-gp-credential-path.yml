name: CTO GP credential path
on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check sealed credential
        shell: bash
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          SUBJECT: ${{ vars.PV_QUAL_SUBJECT_ID }}
        run: |
          test -n "$PV_API_KEY"
          test -n "$SUBJECT"
          echo "SEALED_QUAL_CREDENTIAL_PATH=PASS"
      - name: Probe QUAL trust endpoint
        shell: bash
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          SUBJECT: ${{ vars.PV_QUAL_SUBJECT_ID }}
        run: |
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' "https://provenance-verified-qual.vercel.app/api/v1/trust/$SUBJECT/machine" -H "Authorization: Bearer $PV_API_KEY")
          echo "HTTP_STATUS=$STATUS"
          test "$STATUS" = "200"
