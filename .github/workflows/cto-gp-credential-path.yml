name: CTO GP credential-path qualification
on:
  push:
    branches:
      - cto/gp-credential-path-20260923

permissions:
  contents: read

jobs:
  current-auth-qualification:
    name: Current Auth QUAL Golden Path Probe
    runs-on: ubuntu-latest
    env:
      QUAL_BASE_URL: https://provenance-verified-qual.vercel.app
      QUAL_TENANT_ID: m2-qual-tenant-1
      QUAL_DEVICE_ID: 00000000-0000-4000-c000-000000000001
    steps:
      - uses: actions/checkout@v4

      - name: Assert sealed QUAL credential exists
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
        run: |
          test -n "$PV_API_KEY" || { echo "::error::PV_QUAL_API_KEY missing"; exit 1; }
          echo "PV_QUAL_API_KEY_PRESENT=YES"

      - name: Bootstrap QUAL mobile token
        id: bootstrap
        run: |
          STATUS=$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' \
            -X POST "$QUAL_BASE_URL/api/v1/mobile/token" \
            -H 'content-type: application/json' \
            -d "{\"tenant_id\":\"$QUAL_TENANT_ID\",\"device_id\":\"$QUAL_DEVICE_ID\",\"platform\":\"test\",\"app_version\":\"3.0.0\"}")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = "200" -o "$STATUS" = "201" || { cat /tmp/bootstrap.json; exit 1; }
          python3 - <<'PY'
import json
d=json.load(open('/tmp/bootstrap.json'))
tok=d.get('token') or d.get('access_token') or d.get('mobile_token')
assert tok and isinstance(tok,str)
open('/tmp/mobile_token','w').write(tok)
print('BOOTSTRAP_TOKEN_PRESENT=YES')
PY

      - name: Discover current qualification subject
        id: subject
        env:
          SUBJECT: ${{ vars.PV_QUAL_SUBJECT_ID }}
        run: |
          test -n "$SUBJECT" || { echo "::error::PV_QUAL_SUBJECT_ID missing"; exit 1; }
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "SUBJECT_BOUND=YES"

      - name: GP0 machine trust via current authenticated path
        run: |
          TOKEN=$(cat /tmp/mobile_token)
          STATUS=$(curl -sS -o /tmp/trust.json -w '%{http_code}' \
            "$QUAL_BASE_URL/api/v1/trust/${{ steps.subject.outputs.subject }}/machine" \
            -H "Authorization: Bearer $TOKEN")
          echo "GP0_HTTP=$STATUS"
          test "$STATUS" = "200" || { cat /tmp/trust.json; exit 1; }
          python3 - <<'PY'
import json
d=json.load(open('/tmp/trust.json'))
assert d.get('schema') == 'pv.machine-trust.v1'
print('GP0_MACHINE_TRUST=PASS')
PY

      - name: Credential path classification
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          SUBJECT: ${{ vars.PV_QUAL_SUBJECT_ID }}
        run: |
          test -n "$PV_API_KEY"
          test -n "$SUBJECT"
          echo "SEALED_QUAL_CREDENTIAL_PATH=PASS"
          echo "RUN129_CURRENT_AUTH_LINEAGE=REUSED"

      - name: Internal-endpoint custody classification
        run: |
          echo "GP11_GP12_INTERNAL_TOKEN_REQUIRED=YES"
          echo "Do not expose or synthesize PV_INTERNAL_BUILD_TOKEN in workflow output."
          echo "CURRENT_AUTH_RECONCILIATION=PUBLIC_API_USES_PV_QUAL_API_KEY_INTERNAL_REPLAY_RETAINS_SEPARATE_TOKEN"
