name: CTO QUAL Credential Bridge Probe
on:
  push:
    branches:
      - cto/gp-qual-runner-20260923
permissions:
  contents: read

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUAL_BASE_URL: https://provenance-verified-qual.vercel.app
      QUAL_SUBJECT_ID: PV-TEST-S1-001
    steps:
      - uses: actions/checkout@v4

      - name: Classify sealed credential capabilities
        shell: bash
        env:
          PV_QUAL_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          PV_SUPABASE_SECRET_KEY: ${{ secrets.PV_SUPABASE_SECRET_KEY }}
          PV_INTERNAL_BUILD_TOKEN: ${{ secrets.PV_INTERNAL_BUILD_TOKEN }}
          PV_R17_SMOKE_TOKEN: ${{ secrets.PV_R17_SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PV_QUAL_API_KEY:-}" && echo "PV_QUAL_API_KEY_PRESENT=YES" || echo "PV_QUAL_API_KEY_PRESENT=NO"
          test -n "${PV_SUPABASE_SECRET_KEY:-}" && echo "PV_SUPABASE_SECRET_KEY_PRESENT=YES" || echo "PV_SUPABASE_SECRET_KEY_PRESENT=NO"
          test -n "${PV_INTERNAL_BUILD_TOKEN:-}" && echo "PV_INTERNAL_BUILD_TOKEN_PRESENT=YES" || echo "PV_INTERNAL_BUILD_TOKEN_PRESENT=NO"
          test -n "${PV_R17_SMOKE_TOKEN:-}" && echo "PV_R17_SMOKE_TOKEN_PRESENT=YES" || echo "PV_R17_SMOKE_TOKEN_PRESENT=NO"
          test -n "${PV_QUAL_API_KEY:-}" || { echo "::error::PV_QUAL_API_KEY missing"; exit 1; }

      - name: GP0 current-auth machine trust probe
        id: gp0
        shell: bash
        env:
          PV_QUAL_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/gp0.json -w '%{http_code}'             -H "Authorization: Bearer $PV_QUAL_API_KEY"             -H 'Accept: application/json'             "$QUAL_BASE_URL/api/v1/trust/$QUAL_SUBJECT_ID/machine")
          echo "GP0_HTTP_STATUS=$status"
          python3 - <<'PY'
import json
p='/tmp/gp0.json'
try:
    d=json.load(open(p))
    print('GP0_SCHEMA='+str(d.get('schema','')))
    print('GP0_PUBLIC_ID='+str((d.get('determination') or {}).get('public_id','')))
    print('GP0_ELIGIBLE='+str((d.get('determination') or {}).get('eligible','')))
except Exception:
    print('GP0_JSON_PARSE=FAIL')
PY
          test "$status" = "200" || { echo "::error::GP0 failed HTTP=$status"; exit 1; }

      - name: GP1 current-auth actionability probe
        id: gp1
        shell: bash
        env:
          PV_QUAL_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
        run: |
          set -euo pipefail
          body='{"subject_id":"PV-TEST-S1-001","purpose_id":"PURCHASE","requested_action":"evaluate","claim_scope":"PROVENANCE_ELIGIBLE"}'
          status=$(curl -sS -o /tmp/gp1.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $PV_QUAL_API_KEY"             -H 'Content-Type: application/json'             "$QUAL_BASE_URL/api/v1/actionability"             -d "$body")
          echo "GP1_HTTP_STATUS=$status"
          python3 - <<'PY'
import json
try:
    d=json.load(open('/tmp/gp1.json'))
    print('GP1_SCHEMA='+str(d.get('schema','')))
    print('GP1_DECISION='+str(d.get('decision','')))
    if d.get('error'): print('GP1_ERROR_CODE='+str(d['error'].get('code','')))
except Exception:
    print('GP1_JSON_PARSE=FAIL')
PY
          test "$status" = "200" || { echo "::error::GP1 failed HTTP=$status"; exit 1; }

      - name: Upload redacted probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cto-qual-credential-probe
          path: |
            /tmp/gp0.json
            /tmp/gp1.json
          if-no-files-found: ignore
          retention-days: 7
