name: M2 Real E2E CI

on:
  workflow_dispatch:
  push:
    branches: ['mobile/m2-real-e2e', 'successor/m4-determination-first-r2']

env:
  FLUTTER_VERSION: '3.47.2'
  FLUTTER_CHANNEL: 'stable'
  PV_API_BASE_URL: 'https://provenance-verified-private.vercel.app'
  # EXPECTED_M2_UNIT_COUNT: fail-closed gate — must match actual executed test count.
  # Confirmed executed count: 237 — from CI run 35165330574 on commit 32b3019 (R27).
  # R28 adds 5 tests: C28-1..C28-5 (public reliance failsafe + settlement null ambiguity).
  # Expected count after R28: 237 + 5 = 242.
  # R29 adds 5 tests: C29-1..C29-5 (settlement authority seam wired; PR #47 data.settlement).
  # R29 also updates C22-2 and C28-1..C28-5 (same test count, content updated).
  # Expected count after R29: 242 + 5 = 247.
  # R30 adds 5 tests: C30-1..C30-5 (credential lifecycle rebind; PR #48 data.credential_lifecycle).
  # Confirmed executed count: 252 — from CI run 35176530986 on commit f0915f69 (R30).
  # R31 adds 5 tests: C31-1..C31-5 (lifecycle-aware credential UI + approachingStale advisory).
  # Confirmed executed count: 257 — from CI run 35181638507 on commit bda6d3c (R31).
  # R32 adds 5 tests: C32-1..C32-5 (fail-closed LOOKUP_ERROR/authorityUnavailable/TrustCurrentness).
  # R32 also updates C22-2, C28-1, C28-2, C28-5, C29-3 (same count; tests updated for payment-gate removal).
  # CI run 35182964601 on commit bbe8bcb confirmed 262 total tests (257 passing + 5 failing before R32 fix).
  # Confirmed executed count: 262 — from CI run 35182964601 on commit bbe8bcb (R32) — all 262 pass after fix.
  # R33 adds 4 tests: C33-1..C33-4 (list credential_state authority ruling; AUTHORITY_UNAVAILABLE fail-closed).
  # Confirmed executed count: 266 — from CI run 35185928675 on commit 8adc444 (R33) — all 266 pass;
  #   count gate 262 was sole failure. CI evidence: "+266: All tests passed!"
  # R34 adds 2 tests: C34-1..C34-2 (unknown lifecycle fail-closed authorityUnavailable; pv_credentials source).
  # Confirmed executed count: 268 — from CI run 35191693648 on commit 12728eb (R34) — all 268 pass;
  #   count gate 266 was sole failure. CI evidence: "+268: All tests passed!"
  # R35/R36 adds 1 test: C35-1 (my_pv tier labels match canonical Web/Core names).
  # Confirmed executed count: 269 — from CI run 35198037033 job 105125821219 on commit 4c91907 (R36) — all 269 pass;
  #   count gate 268 was sole failure. CI evidence: "+269: All tests passed!"
  # R42 adds 6 tests: C42-1..C42-6 (offline reliance authority boundary; local receipt validity state fix).
  # Confirmed executed count after R42: 275 — from CI run 35221586604 (aea8c35b) — Linux PASS, macOS PASS.
  # R44 adds 5 tests: C44-1..C44-5 (My PV authority + evidence boundary; eligible gate + wording).
  # Confirmed executed count after R44: 280 — from CI run 35227641452 (39e6cd9) — Linux PASS, macOS PASS.
  # R45 adds 7 tests: C45-proof-1..C45-proof-2 (Riverpod retention behavioral proof) + C45-1..C45-5 (autoDispose source assertions).
  # Anticipated count after R45: 280 + 7 = 287. PENDING CI CONFIRMATION.
  # R46 adds 5 tests: C46-1..C46-5 (native photo+evidence picker wiring regression locks;
  #   image_picker/file_picker wired into submit_screen.dart; file_picker >=8.1.4 version gate).
  # Anticipated count after R46: 287 + 5 = 292. PENDING CI CONFIRMATION.
  # R47 adds 1 test C47-1 (Share button clipboard), then R48 REPLACES C47-1 with
  #   2 fail-closed tests (C47-1, C47-2: CROSS_LANE_HANDOFF_REQUIRED semantic locks).
  #   Net R47→R48 delta on C47: -1 + 2 = +1 (293 + 1 = stays at 293 via R47 then corrected).
  # R48 adds 4 tests total: corrected C47-1, C47-2 (+1 net on C47); C48-1 manifest audit;
  #   C48-2 Gradle upgrade-only guard. Net R48 additions: +1 (C47 correction) + 1 + 1 = +3.
  # Confirmed executed count after R48: 296 — from CI run 35249574619 on commit 6354263 — all 296 pass.
  # R49 adds 5 tests: C50-1..C50-5 (M2-50 determination-first flow source locks:
  #   7-step wizard structure, det-first ordering, server-authoritative determinedTier,
  #   uploadPendingDocuments wiring, homeAlertsProvider server-sourced alerts).
  # Confirmed executed count after R49: 301 — from CI run 35251283402 on commit 1da65b1 — all 301 pass (Linux + macOS).
  # Test distribution: api_client_m2_test.dart: 14, eight_stone_parity_test.dart: 49,
  #   m4_customer_contract_test.dart: +5 new R28 tests (C28-1..5) +5 new R29 tests (C29-1..5)
  #     +5 new R30 tests (C30-1..5) +5 new R31 tests (C31-1..5) +5 new R32 tests (C32-1..5)
  #     +4 new R33 tests (C33-1..4) +2 new R34 tests (C34-1..2) +1 new R35 test (C35-1)
  #     +6 new R42 tests (C42-1..C42-6) +5 new R44 tests (C44-1..C44-5)
  #     +7 new R45 tests (C45-proof-1..C45-proof-2 + C45-1..C45-5)
  #     +5 new R46 tests (C46-1..C46-5)
  #     +2 R48-corrected C47 tests (C47-1, C47-2) +2 new R48 tests (C48-1, C48-2)
  #     +5 new R49 tests (C50-1..C50-5),
  #     +5 new R50 tests (C50-6..C50-10), C47-1/C47-2 updated (same IDs, not new).
  #     +5 new M2-50-04 tests (C50-11..C50-15).
  #   machine_trust_response_test.dart: 37, qr_handler_test.dart: 21,
  #   trust_models_test.dart: 37.
  # DO NOT update this value by hand. Update only after an executed GitHub Actions
  # run on this branch confirms the new count via FLUTTER_TESTS_*=PASS output.
  # Confirmed executed count: 306 — from CI run 35257032745 on commit d5d1b8e (R50).
  # Confirmed executed count: 311 — from CI run 35259983102 on commit ddb2f2f (M2-50-04 C50-11..C50-15). All 311 pass.
  # M2-50-05 (commit 8bf94b6) adds 5 C51 tests (C51-1..C51-5). Count: 311 + 5 = 316.
  # Confirmed executed count: 316 — from CI run 35285581356 / artifact 10523134227 at commit d3a5263
  #   (C51-2 harness repair only; no product change; C51-2 count gate was sole failure at 322).
  # M2-50-07/08 (commit cb51b11) adds 6 C52/C53 tests (C52-1, C52-2, C53-1..C53-4).
  # Confirmed executed count: 322 — from CI run 35286047761 on commit cb51b11 — Linux PASS, macOS PASS; all 322 pass.
  #   android_aab_sha256: dc8e0a2675beb93d89334cee6b7bef2c2097f38e496276ba528834ff3ef6749e (UNSIGNED_QUALIFICATION)
  #   ios_archive_sha256: 250e362001928fc0072d9103d89c2a3a0dac22cf5f899a150e9d0613d7786b07 (no-codesign)
  # M2-50-07 inventory (C54-1..C54-4) adds 4 tests. Projected count: 326. Pending CI confirmation.
  EXPECTED_M2_UNIT_COUNT: '326'

jobs:
  linux-android:
    name: 'Linux — Analyze + Unit Tests + Android AAB'
    runs-on: ubuntu-latest
    outputs:
      pubspec_lock_sha256: ${{ steps.post_pub.outputs.pubspec_lock_sha256 }}
      android_aab_sha256: ${{ steps.aab_hash.outputs.android_aab_sha256 }}
      android_aab_size: ${{ steps.aab_hash.outputs.android_aab_size }}
      flutter_version: ${{ steps.versions.outputs.flutter_version }}
      dart_version: ${{ steps.versions.outputs.dart_version }}
      java_version: ${{ steps.versions.outputs.java_version }}
      test_count: ${{ steps.flutter_test.outputs.test_count }}
      head_sha: ${{ steps.sha.outputs.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record HEAD SHA
        id: sha
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "head_sha=$HEAD" >> $GITHUB_OUTPUT
          echo "M2 HEAD SHA: $HEAD"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print versions
        id: versions
        run: |
          flutter --version
          dart --version
          java -version 2>&1
          echo "flutter_version=$(flutter --version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')" >> $GITHUB_OUTPUT
          echo "java_version=$(java -version 2>&1 | head -1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Patch gradle.properties (remove Mac-specific JDK path)
        run: |
          sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          echo "gradle.properties after patch:"
          cat android/gradle.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install NDK 28.2.13676358
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" 2>&1 | tail -3 || \
          sdkmanager "ndk;28.2.13676358" 2>&1 | tail -3 || true
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "NDK directory check complete"

      - name: flutter pub get
        run: flutter pub get

      - name: Record pubspec.lock SHA256
        id: post_pub
        run: |
          LOCK=$(sha256sum pubspec.lock | cut -d' ' -f1)
          echo "pubspec_lock_sha256=$LOCK" >> $GITHUB_OUTPUT
          echo "pubspec.lock SHA256: $LOCK"

      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee flutter-analyze-linux.txt
          grep -q "No issues found" flutter-analyze-linux.txt || \
            { echo "::error::flutter analyze found issues"; exit 1; }
          echo "FLUTTER_ANALYZE_LINUX=PASS"

      - name: flutter test — unit tests (fail-closed gate; see EXPECTED_M2_UNIT_COUNT)
        id: flutter_test
        run: |
          flutter test test/unit/ --reporter expanded 2>&1 | tee flutter-test-linux.txt
          grep -q "All tests passed" flutter-test-linux.txt || \
            { echo "::error::flutter test: not all tests passed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-linux.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "Detected unit test count: $TEST_COUNT"
          [ "$TEST_COUNT" = "${{ env.EXPECTED_M2_UNIT_COUNT }}" ] || \
            { echo "::error::Expected ${{ env.EXPECTED_M2_UNIT_COUNT }} tests, got $TEST_COUNT"; exit 1; }
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "FLUTTER_TESTS_LINUX=PASS ($TEST_COUNT/${{ env.EXPECTED_M2_UNIT_COUNT }})"

      - name: Trust law static assertions
        run: |
          COUNT=$(grep -rE 'moneyControlsTrust\s*=\s*true' lib/ | wc -l)
          [ "$COUNT" -eq 0 ] || { echo "::error::moneyControlsTrust=true found!"; exit 1; }
          COUNT=$(grep -rE 'actionabilityCacheForReliance\s*=\s*true' lib/ | wc -l)
          [ "$COUNT" -eq 0 ] || { echo "::error::actionabilityCacheForReliance=true found!"; exit 1; }
          echo "TRUST_LAW_STATIC=PASS"

      - name: M2 security assertions
        run: |
          # Bearer auth must be used (not internal token)
          grep -q 'Authorization.*Bearer' lib/core/network/api_client.dart || \
            { echo "::error::Bearer auth not found in api_client.dart"; exit 1; }
          # x-pv-internal-token must NOT be in the consumer client
          COUNT=$(grep -E 'x-pv-internal-token' lib/core/network/api_client.dart | wc -l)
          [ "$COUNT" -eq 0 ] || \
            { echo "::error::x-pv-internal-token found in consumer api_client!"; exit 1; }
          # pv.machine-trust.v1 schema expected
          grep -q 'pv.machine-trust.v1' lib/trust/machine_trust_response.dart || \
            { echo "::error::pv.machine-trust.v1 schema not found"; exit 1; }
          # Trust state digest extracted from header
          grep -q 'x-pv-trust-state-digest' lib/core/network/api_client.dart || \
            { echo "::error::x-pv-trust-state-digest header extraction missing"; exit 1; }
          echo "M2_SECURITY_ASSERTIONS=PASS"

      - name: UNQUALIFIED_T1_OVERCLAIM = ZERO assertion
        run: |
          # safeTier must be null when not eligible
          grep -q 'UNQUALIFIED' test/unit/machine_trust_response_test.dart || \
            { echo "::error::UNQUALIFIED_T1_OVERCLAIM test missing"; exit 1; }
          echo "UNQUALIFIED_T1_OVERCLAIM_ZERO=PASS"

      - name: Secret scan — source
        run: |
          PATTERNS='sk_live_|rk_live_|sk_test_|service_role|BEGIN RSA PRIVATE|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY|pv_live_[a-z0-9]{32,}'
          COUNT=$(grep -rEI "$PATTERNS" lib/ test/ pubspec.yaml 2>/dev/null | \
            grep -v '//.*ignore\|#.*ignore\|_test_key_for_qual_only' | wc -l || echo 0)
          echo "Source secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in source!"; exit 1; }
          echo "SECRETS_IN_SOURCE=ZERO"

      - name: Build Android AAB (qualification release — unsigned; SIGNING_STATE=UNSIGNED_QUALIFICATION)
        run: |
          flutter build appbundle --release \
            --flavor qualification \
            --dart-define=ENVIRONMENT=qualification \
            --dart-define=PV_API_BASE_URL=${{ env.PV_API_BASE_URL }}

      - name: Assert SIGNING_STATE=UNSIGNED_QUALIFICATION
        run: |
          AAB=build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          mkdir -p /tmp/aab-sign-check
          unzip -o "$AAB" -d /tmp/aab-sign-check 2>/dev/null
          if find /tmp/aab-sign-check -name "*.RSA" -o -name "*.DSA" -o -name "*.EC" -o -name "*.SF" \
               2>/dev/null | grep -q .; then
            echo "::error::SIGNING_STATE assertion failed: qualification AAB contains signing evidence"
            exit 1
          fi
          echo "SIGNING_STATE=UNSIGNED_QUALIFICATION"
          rm -rf /tmp/aab-sign-check

      - name: Assert PRODUCTION_SIGNING_DEPENDENCY_GRAPH
        run: |
          # Dry-run bundleProductionRelease to prove assertProductionSigningForProductionRelease
          # is in the task dependency graph — without credentials, without building anything.
          DRY_RUN_OUTPUT=$(cd android && ./gradlew :app:bundleProductionRelease --dry-run 2>&1)
          echo "$DRY_RUN_OUTPUT"
          if ! echo "$DRY_RUN_OUTPUT" | grep -q ":app:assertProductionSigningForProductionRelease"; then
            echo "::error::PRODUCTION_SIGNING_DEPENDENCY_GRAPH: gate task absent from bundleProductionRelease dependency plan"
            exit 1
          fi
          if [ -f "build/app/outputs/bundle/productionRelease/app-production-release.aab" ]; then
            echo "::error::PRODUCTION_AAB_EMITTED: dry-run produced a production AAB — custody violation"
            exit 1
          fi
          echo "PRODUCTION_SIGNING_DEPENDENCY_GRAPH=PASS (gate in dependency plan, no AAB emitted)"

      - name: Assert PRODUCTION_SIGNING_FAIL_CLOSED
        run: |
          # productionRelease must fail closed: gate must exit non-zero and emit
          # the exact PRODUCTION_SIGNING_AUTHORITY_REQUIRED marker.
          # CI has no key.properties and no ANDROID_SIGNING_PASSWORD.
          set +e
          (cd android && ./gradlew :app:assertProductionSigningForProductionRelease 2>&1) | tee /tmp/gate-output.txt
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GATE_EXIT" -eq 0 ]; then
            echo "::error::PRODUCTION_SIGNING_AUTHORITY_REQUIRED: gate succeeded unexpectedly — fail-closed regression"
            exit 1
          fi
          if ! grep -q "PRODUCTION_SIGNING_AUTHORITY_REQUIRED" /tmp/gate-output.txt; then
            echo "::error::PRODUCTION_SIGNING_FAIL_CLOSED: gate failed but PRODUCTION_SIGNING_AUTHORITY_REQUIRED marker absent"
            cat /tmp/gate-output.txt
            exit 1
          fi
          echo "PRODUCTION_SIGNING_FAIL_CLOSED=PASS (PRODUCTION_SIGNING_AUTHORITY_REQUIRED marker confirmed)"

      - name: Compute Android AAB SHA256
        id: aab_hash
        run: |
          AAB=build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          [ -f "$AAB" ] || { echo "::error::AAB not found: $AAB"; exit 1; }
          HASH=$(sha256sum "$AAB" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$AAB")
          echo "android_aab_sha256=$HASH" >> $GITHUB_OUTPUT
          echo "android_aab_size=$SIZE" >> $GITHUB_OUTPUT
          echo "Android AAB SHA256: $HASH"
          echo "Android AAB size:   $SIZE bytes"

      - name: Secret scan — Android AAB
        run: |
          AAB=build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          mkdir -p /tmp/aab-scan
          unzip -o "$AAB" -d /tmp/aab-scan 2>/dev/null || true
          PATTERNS='sk_live_|rk_live_|service_role|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY'
          COUNT=$(find /tmp/aab-scan -type f -name "*.dex" \
            -exec strings {} \; 2>/dev/null | \
            grep -E "$PATTERNS" 2>/dev/null | wc -l)
          echo "AAB secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in Android AAB!"; exit 1; }
          echo "SECRETS_IN_ANDROID_ARTIFACT=ZERO"
          rm -rf /tmp/aab-scan

      - name: Package identity assertions
        run: |
          grep -q 'applicationId = "to.veritan.pv"' android/app/build.gradle.kts || \
            { echo "::error::Production app ID missing"; exit 1; }
          grep -q 'applicationId = "to.veritan.pv.qual"' android/app/build.gradle.kts || \
            { echo "::error::Qualification app ID missing"; exit 1; }
          grep -q 'applicationId = "to.veritan.pv.dev"' android/app/build.gradle.kts || \
            { echo "::error::Development app ID missing"; exit 1; }
          echo "PACKAGE_IDENTITY=PASS"

      - name: Eight-stone binding assert
        run: |
          grep -q 'STONE-1' test/unit/eight_stone_parity_test.dart || \
            { echo "::error::STONE-1 binding missing"; exit 1; }
          grep -q 'STONE-8' test/unit/eight_stone_parity_test.dart || \
            { echo "::error::STONE-8 binding missing"; exit 1; }
          STONE_COUNT=$(grep -oE "STONE-[0-9]:" test/unit/eight_stone_parity_test.dart | \
            sort -u | wc -l)
          echo "Eight-stone groups: $STONE_COUNT"
          [ "$STONE_COUNT" -ge 8 ] || \
            { echo "::error::Expected 8 stone groups, found $STONE_COUNT"; exit 1; }
          echo "EIGHT_STONE_PARITY=8/8"

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: pv-mobile-m2-android-qualification-aab
          path: build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          retention-days: 30

      - name: Upload Linux test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-linux
          path: flutter-test-linux.txt
          retention-days: 30
          if-no-files-found: warn

  macos-ios:
    name: 'macOS — Analyze + Unit Tests + iOS Build'
    runs-on: macos-latest
    outputs:
      ios_archive_sha256: ${{ steps.ios_hash.outputs.ios_archive_sha256 }}
      ios_archive_size: ${{ steps.ios_hash.outputs.ios_archive_size }}
      xcode_version: ${{ steps.versions.outputs.xcode_version }}
      dart_version: ${{ steps.versions.outputs.dart_version }}
      test_count: ${{ steps.flutter_test.outputs.test_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print versions
        id: versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          echo "xcode_version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')" >> $GITHUB_OUTPUT

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee flutter-analyze-macos.txt
          grep -q "No issues found" flutter-analyze-macos.txt || \
            { echo "::error::flutter analyze found issues"; exit 1; }
          echo "FLUTTER_ANALYZE_MACOS=PASS"

      - name: flutter test — unit tests (fail-closed gate; see EXPECTED_M2_UNIT_COUNT)
        id: flutter_test
        run: |
          flutter test test/unit/ --reporter expanded 2>&1 | tee flutter-test-macos.txt
          grep -q "All tests passed" flutter-test-macos.txt || \
            { echo "::error::flutter test: not all tests passed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-macos.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "Detected unit test count: $TEST_COUNT"
          [ "$TEST_COUNT" = "${{ env.EXPECTED_M2_UNIT_COUNT }}" ] || \
            { echo "::error::Expected ${{ env.EXPECTED_M2_UNIT_COUNT }} tests, got $TEST_COUNT"; exit 1; }
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "FLUTTER_TESTS_MACOS=PASS ($TEST_COUNT/${{ env.EXPECTED_M2_UNIT_COUNT }})"

      - name: Build iOS (release, no-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=PV_API_BASE_URL=${{ env.PV_API_BASE_URL }}

      - name: Archive Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r runner-app-m2.zip Runner.app
          ls -lh runner-app-m2.zip

      - name: Compute iOS archive SHA256
        id: ios_hash
        run: |
          ARCHIVE=build/ios/iphoneos/runner-app-m2.zip
          [ -f "$ARCHIVE" ] || { echo "::error::iOS archive not found"; exit 1; }
          HASH=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)
          SIZE=$(stat -f%z "$ARCHIVE")
          echo "ios_archive_sha256=$HASH" >> $GITHUB_OUTPUT
          echo "ios_archive_size=$SIZE" >> $GITHUB_OUTPUT
          echo "iOS archive SHA256: $HASH"
          echo "iOS archive size:   $SIZE bytes"

      - name: Secret scan — iOS artifact
        run: |
          PATTERNS='sk_live_|rk_live_|service_role|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY'
          COUNT=$(strings build/ios/iphoneos/Runner.app/Runner 2>/dev/null | \
            grep -E "$PATTERNS" 2>/dev/null | wc -l)
          echo "iOS secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in iOS artifact!"; exit 1; }
          echo "SECRETS_IN_IOS_ARTIFACT=ZERO"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pv-mobile-m2-ios-nocodesign-app
          path: build/ios/iphoneos/runner-app-m2.zip
          retention-days: 30

      - name: Upload macOS test output
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-macos
          path: flutter-test-macos.txt
          retention-days: 30

  real-backend-integration:
    name: 'Real Backend Integration Tests'
    runs-on: ubuntu-latest
    # Only runs when PV_API_KEY secret is set.
    # Without the secret, this job is a documented human-only boundary.
    if: ${{ vars.PV_QUAL_BACKEND_ENABLED == 'true' }}
    outputs:
      integration_gate: ${{ steps.int_gate.outputs.integration_gate }}
      m2_int_test_count: ${{ steps.int_test.outputs.m2_int_test_count }}
      integration_state: ${{ steps.int_classify.outputs.integration_state }}
      http_status: ${{ steps.probe.outputs.http_status }}
      content_type: ${{ steps.probe.outputs.content_type }}
      bootstrap_classification: ${{ steps.probe.outputs.bootstrap_classification }}
      endpoint_url_sha256: ${{ steps.probe.outputs.endpoint_url_sha256 }}
      endpoint_host: ${{ steps.probe.outputs.endpoint_host }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Probe bootstrap endpoint
        id: probe
        env:
          PV_QUAL_API_BASE_URL: ${{ vars.PV_QUAL_API_BASE_URL }}
        run: |
          if [ -z "$PV_QUAL_API_BASE_URL" ]; then
            echo "endpoint_url_sha256=N/A" >> $GITHUB_OUTPUT
            echo "endpoint_host=N/A" >> $GITHUB_OUTPUT
            echo "http_status=N/A" >> $GITHUB_OUTPUT
            echo "content_type=N/A" >> $GITHUB_OUTPUT
            echo "bootstrap_classification=CREDENTIAL_OR_CONFIG_MISSING" >> $GITHUB_OUTPUT
            echo "PROBE: PV_QUAL_API_BASE_URL not configured"
            exit 0
          fi
          ENDPOINT_URL_SHA=$(printf '%s' "$PV_QUAL_API_BASE_URL" | sha256sum | cut -d' ' -f1)
          ENDPOINT_HOST=$(printf '%s' "$PV_QUAL_API_BASE_URL" | sed 's|https\?://||' | cut -d'/' -f1)
          echo "endpoint_url_sha256=$ENDPOINT_URL_SHA" >> $GITHUB_OUTPUT
          echo "endpoint_host=$ENDPOINT_HOST" >> $GITHUB_OUTPUT
          HTTP_STATUS=$(curl -s \
            -D /tmp/probe-headers.txt \
            -o /tmp/probe-body.txt \
            -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --connect-timeout 10 --max-time 15 \
            "$PV_QUAL_API_BASE_URL/api/v1/mobile/token" \
            -d '{"tenant_id":"ci-diagnostic-probe","device_id":"ci-probe-device","platform":"test","app_version":"0.0.0"}' \
            2>/dev/null || echo "000")
          echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          CONTENT_TYPE=$(grep -i '^content-type:' /tmp/probe-headers.txt 2>/dev/null | \
            head -1 | tr -d '\r\n' | sed 's/.*[Cc]ontent-[Tt]ype: *//' | sed 's/"/\\"/')
          echo "content_type=$CONTENT_TYPE" >> $GITHUB_OUTPUT
          RESP_PREFIX=$(head -c 200 /tmp/probe-body.txt 2>/dev/null | tr -d '\n\r' | cut -c1-80)
          echo "PROBE: HTTP=$HTTP_STATUS host=$ENDPOINT_HOST content-type=$CONTENT_TYPE"
          echo "PROBE: response-prefix=${RESP_PREFIX:0:80}"
          if echo "$RESP_PREFIX" | grep -qi '<!DOCTYPE\|<html'; then
            echo "bootstrap_classification=HTML_RESPONSE" >> $GITHUB_OUTPUT
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "bootstrap_classification=CONNECTION_FAILED" >> $GITHUB_OUTPUT
          elif echo "$RESP_PREFIX" | grep -q '^[[:space:]]*{'; then
            echo "bootstrap_classification=JSON_RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "bootstrap_classification=UNKNOWN" >> $GITHUB_OUTPUT
          fi

      - name: Real backend integration tests (M2-INT-01 to M2-INT-08)
        id: int_test
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          PV_TENANT_ID: ${{ vars.PV_QUAL_TENANT_ID }}
          PV_QUAL_SUBJECT_ID: ${{ vars.PV_QUAL_SUBJECT_ID }}
          PV_QUAL_API_BASE_URL: ${{ vars.PV_QUAL_API_BASE_URL }}
        run: |
          flutter test test/integration/ --reporter expanded \
            --dart-define=PV_API_BASE_URL=$PV_QUAL_API_BASE_URL \
            --dart-define=PV_API_KEY=$PV_API_KEY \
            --dart-define=PV_TENANT_ID=$PV_TENANT_ID \
            --dart-define=PV_QUAL_SUBJECT_ID=$PV_QUAL_SUBJECT_ID \
            --dart-define=PV_MOBILE_PLATFORM=test \
            2>&1 | tee flutter-test-integration.txt
          grep -q "All tests passed" flutter-test-integration.txt || \
            { echo "::error::Integration tests failed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-integration.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "m2_int_test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "M2_REAL_BACKEND_INTEGRATION=PASS ($TEST_COUNT tests)"

      - name: Integration gate assertion
        id: int_gate
        run: |
          echo "integration_gate=PASS" >> $GITHUB_OUTPUT
          echo "M2_INT_GATE=PASS"

      - name: Classify integration result
        id: int_classify
        if: always()
        run: |
          if [ "${{ steps.int_test.outcome }}" = "success" ]; then
            echo "integration_state=EXECUTED_PASS" >> $GITHUB_OUTPUT
          elif [ "${{ steps.int_test.outcome }}" = "failure" ]; then
            BOOTSTRAP_CLASS="${{ steps.probe.outputs.bootstrap_classification }}"
            if [ "$BOOTSTRAP_CLASS" = "HTML_RESPONSE" ] || [ "$BOOTSTRAP_CLASS" = "CONNECTION_FAILED" ]; then
              echo "integration_state=EXECUTED_FAIL_EXTERNAL_BACKEND" >> $GITHUB_OUTPUT
            else
              echo "integration_state=EXECUTED_FAIL_NATIVE_OR_UNCLASSIFIED" >> $GITHUB_OUTPUT
            fi
          else
            echo "integration_state=EXECUTED_FAIL_NATIVE_OR_UNCLASSIFIED" >> $GITHUB_OUTPUT
          fi
          echo "CLASSIFY: integration_state set (int_test outcome=${{ steps.int_test.outcome }})"

      - name: Upload integration test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-integration
          path: flutter-test-integration.txt
          retention-days: 30
          if-no-files-found: warn

  evidence:
    name: 'Evidence Assembly'
    needs: [linux-android, macos-ios, real-backend-integration]
    if: ${{ always() && needs.linux-android.result == 'success' && needs.macos-ios.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Verify downloaded artifact hashes
        run: |
          ANDROID_ACTUAL=$(sha256sum \
            artifacts/pv-mobile-m2-android-qualification-aab/app-qualification-release.aab \
            | cut -d' ' -f1)
          ANDROID_EXPECTED="${{ needs.linux-android.outputs.android_aab_sha256 }}"
          echo "Android AAB: expected=$ANDROID_EXPECTED actual=$ANDROID_ACTUAL"
          [ "$ANDROID_ACTUAL" = "$ANDROID_EXPECTED" ] || \
            { echo "::error::Android AAB hash mismatch!"; exit 1; }

          IOS_ACTUAL=$(sha256sum \
            artifacts/pv-mobile-m2-ios-nocodesign-app/runner-app-m2.zip \
            | cut -d' ' -f1)
          IOS_EXPECTED="${{ needs.macos-ios.outputs.ios_archive_sha256 }}"
          echo "iOS archive: expected=$IOS_EXPECTED actual=$IOS_ACTUAL"
          [ "$IOS_ACTUAL" = "$IOS_EXPECTED" ] || \
            { echo "::error::iOS archive hash mismatch!"; exit 1; }

          echo "DOWNLOADED_HASH_MATCH=PASS"

      - name: Generate mobile-m2-ci-evidence.json
        run: |
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Derive real-backend truth from actual integration job result.
          # Possible results: success | failure | skipped (disabled by authority) | cancelled.
          INTEGRATION_RESULT="${{ needs.real-backend-integration.result }}"
          INTEGRATION_STATE="${{ needs.real-backend-integration.outputs.integration_state }}"
          HTTP_STATUS="${{ needs.real-backend-integration.outputs.http_status }}"
          CONTENT_TYPE="${{ needs.real-backend-integration.outputs.content_type }}"
          BOOTSTRAP_CLASS="${{ needs.real-backend-integration.outputs.bootstrap_classification }}"
          ENDPOINT_SHA="${{ needs.real-backend-integration.outputs.endpoint_url_sha256 }}"
          ENDPOINT_HOST="${{ needs.real-backend-integration.outputs.endpoint_host }}"

          if [ "$INTEGRATION_RESULT" = "skipped" ] || [ -z "$INTEGRATION_STATE" ]; then
            FINAL_STATE="DISABLED_BY_AUTHORITY"
            ENDPOINT_SHA="N/A"
            ENDPOINT_HOST="N/A"
            HTTP_STATUS="N/A"
            CONTENT_TYPE="N/A"
            BOOTSTRAP_CLASS="NOT_EXECUTED"
          else
            FINAL_STATE="$INTEGRATION_STATE"
          fi

          # Sanitize content_type for JSON embedding (strip quotes/control chars).
          CONTENT_TYPE_SAFE=$(printf '%s' "$CONTENT_TYPE" | tr -d '"' | tr -d '\r\n' | cut -c1-80)

          cat > mobile-m2-ci-evidence.json << ENDJSON
          {
            "schema": "pv.mobile-ci-evidence.m2.v2",
            "m2_head_sha": "${{ needs.linux-android.outputs.head_sha }}",
            "m1_ancestry_sha": "82ad06a",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "$WORKFLOW_URL",
            "workflow_sha": "${{ github.sha }}",
            "flutter_version": "${{ needs.linux-android.outputs.flutter_version }}",
            "dart_version_linux": "${{ needs.linux-android.outputs.dart_version }}",
            "dart_version_macos": "${{ needs.macos-ios.outputs.dart_version }}",
            "java_version": "${{ needs.linux-android.outputs.java_version }}",
            "xcode_version": "${{ needs.macos-ios.outputs.xcode_version }}",
            "pubspec_lock_sha256": "${{ needs.linux-android.outputs.pubspec_lock_sha256 }}",
            "linux_flutter_analyze": "PASS",
            "linux_flutter_test_unit": "PASS",
            "linux_unit_test_count": ${{ needs.linux-android.outputs.test_count }},
            "android_build": "PASS",
            "android_flavor": "qualification",
            "android_aab_sha256": "${{ needs.linux-android.outputs.android_aab_sha256 }}",
            "android_aab_size_bytes": ${{ needs.linux-android.outputs.android_aab_size }},
            "signing_state": "UNSIGNED_QUALIFICATION",
            "production_signing_dependency_graph": "PASS",
            "production_signing_fail_closed": "PASS",
            "macos_flutter_analyze": "PASS",
            "macos_flutter_test_unit": "PASS",
            "macos_unit_test_count": ${{ needs.macos-ios.outputs.test_count }},
            "ios_build": "PASS",
            "ios_codesign": false,
            "ios_archive_sha256": "${{ needs.macos-ios.outputs.ios_archive_sha256 }}",
            "ios_archive_size_bytes": ${{ needs.macos-ios.outputs.ios_archive_size }},
            "source_secret_scan": "ZERO",
            "android_secret_scan": "ZERO",
            "ios_secret_scan": "ZERO",
            "m2_security_assertions": "PASS",
            "bearer_auth": "PASS",
            "internal_token_absent": "PASS",
            "trust_state_digest_from_header": "PASS",
            "unqualified_t1_overclaim": "ZERO",
            "package_identity": {
              "prod": "to.veritan.pv",
              "qual": "to.veritan.pv.qual",
              "dev": "to.veritan.pv.dev",
              "result": "PASS"
            },
            "trust_law": {
              "money_controls_trust": false,
              "actionability_cache_for_reliance": false,
              "result": "PASS"
            },
            "real_backend": {
              "endpoint_binding": "sha256:$ENDPOINT_SHA",
              "endpoint_host_sanitized": "$ENDPOINT_HOST",
              "bootstrap_path": "/api/v1/mobile/token",
              "api_key_source": "PV_QUAL_API_KEY (GitHub secret)",
              "integration_state": "$FINAL_STATE",
              "http_status": "$HTTP_STATUS",
              "content_type": "$CONTENT_TYPE_SAFE",
              "bootstrap_classification": "$BOOTSTRAP_CLASS"
            },
            "eight_stone_binding": "PASS",
            "downloaded_android_hash_match": "PASS",
            "downloaded_ios_hash_match": "PASS",
            "pv_backend_mutations": "ZERO",
            "production_mutations": "ZERO",
            "v4_activated": "NO",
            "workflow_conclusion": "SUCCESS"
          }
          ENDJSON
          cat mobile-m2-ci-evidence.json

      - name: Assert evidence truth
        run: |
          # Regression gate: when integration executed, evidence must not claim
          # PENDING_CREDENTIAL_PROVISIONING and must not bind to the global build URL.
          INTEGRATION_RESULT="${{ needs.real-backend-integration.result }}"
          if [ "$INTEGRATION_RESULT" = "success" ] || [ "$INTEGRATION_RESULT" = "failure" ]; then
            if grep -q 'PENDING_CREDENTIAL_PROVISIONING' mobile-m2-ci-evidence.json; then
              echo "::error::EVIDENCE_TRUTH_REGRESSION: integration executed but evidence claims PENDING_CREDENTIAL_PROVISIONING"
              exit 1
            fi
            GLOBAL_URL_SHA=$(printf '%s' '${{ env.PV_API_BASE_URL }}' | sha256sum | cut -d' ' -f1)
            if grep -q "sha256:$GLOBAL_URL_SHA" mobile-m2-ci-evidence.json; then
              echo "::error::EVIDENCE_TRUTH_REGRESSION: evidence binds global build URL instead of qualification endpoint"
              exit 1
            fi
          fi
          echo "EVIDENCE_TRUTH=PASS"

      - name: Generate checksum manifest
        run: |
          sha256sum \
            artifacts/pv-mobile-m2-android-qualification-aab/app-qualification-release.aab \
            artifacts/pv-mobile-m2-ios-nocodesign-app/runner-app-m2.zip \
            mobile-m2-ci-evidence.json \
            > checksum-manifest-m2.txt
          cat checksum-manifest-m2.txt
          echo "HASH_MISMATCHES=ZERO"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m2-ci-evidence
          path: |
            mobile-m2-ci-evidence.json
            checksum-manifest-m2.txt
          retention-days: 90
