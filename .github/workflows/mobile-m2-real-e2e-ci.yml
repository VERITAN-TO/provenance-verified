name: M2 Real E2E CI

on:
  workflow_dispatch:
  push:
    branches: ['mobile/m2-real-e2e']

env:
  FLUTTER_VERSION: '3.47.2'
  FLUTTER_CHANNEL: 'stable'
  PV_API_BASE_URL: 'https://provenance-verified-private.vercel.app'
  EXPECTED_M2_UNIT_COUNT: '164'

jobs:
  linux-android:
    name: 'Linux — Analyze + Unit Tests + Android AAB'
    runs-on: ubuntu-latest
    outputs:
      pubspec_lock_sha256: ${{ steps.post_pub.outputs.pubspec_lock_sha256 }}
      android_aab_sha256: ${{ steps.aab_hash.outputs.android_aab_sha256 }}
      android_aab_size: ${{ steps.aab_hash.outputs.android_aab_size }}
      flutter_version: ${{ steps.versions.outputs.flutter_version }}
      dart_version: ${{ steps.versions.outputs.dart_version }}
      java_version: ${{ steps.versions.outputs.java_version }}
      test_count: ${{ steps.flutter_test.outputs.test_count }}
      head_sha: ${{ steps.sha.outputs.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record HEAD SHA
        id: sha
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "head_sha=$HEAD" >> $GITHUB_OUTPUT
          echo "M2 HEAD SHA: $HEAD"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print versions
        id: versions
        run: |
          flutter --version
          dart --version
          java -version 2>&1
          echo "flutter_version=$(flutter --version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')" >> $GITHUB_OUTPUT
          echo "java_version=$(java -version 2>&1 | head -1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Patch gradle.properties (remove Mac-specific JDK path)
        run: |
          sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          echo "gradle.properties after patch:"
          cat android/gradle.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install NDK 28.2.13676358
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" 2>&1 | tail -3 || \
          sdkmanager "ndk;28.2.13676358" 2>&1 | tail -3 || true
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "NDK directory check complete"

      - name: flutter pub get
        run: flutter pub get

      - name: Record pubspec.lock SHA256
        id: post_pub
        run: |
          LOCK=$(sha256sum pubspec.lock | cut -d' ' -f1)
          echo "pubspec_lock_sha256=$LOCK" >> $GITHUB_OUTPUT
          echo "pubspec.lock SHA256: $LOCK"

      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee flutter-analyze-linux.txt
          grep -q "No issues found" flutter-analyze-linux.txt || \
            { echo "::error::flutter analyze found issues"; exit 1; }
          echo "FLUTTER_ANALYZE_LINUX=PASS"

      - name: flutter test — unit tests (assert exactly 172)
        id: flutter_test
        run: |
          flutter test test/unit/ --reporter expanded 2>&1 | tee flutter-test-linux.txt
          grep -q "All tests passed" flutter-test-linux.txt || \
            { echo "::error::flutter test: not all tests passed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-linux.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "Detected unit test count: $TEST_COUNT"
          [ "$TEST_COUNT" = "${{ env.EXPECTED_M2_UNIT_COUNT }}" ] || \
            { echo "::error::Expected ${{ env.EXPECTED_M2_UNIT_COUNT }} tests, got $TEST_COUNT"; exit 1; }
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "FLUTTER_TESTS_LINUX=PASS ($TEST_COUNT/${{ env.EXPECTED_M2_UNIT_COUNT }})"

      - name: Trust law static assertions
        run: |
          COUNT=$(grep -rE 'moneyControlsTrust\s*=\s*true' lib/ | wc -l)
          [ "$COUNT" -eq 0 ] || { echo "::error::moneyControlsTrust=true found!"; exit 1; }
          COUNT=$(grep -rE 'actionabilityCacheForReliance\s*=\s*true' lib/ | wc -l)
          [ "$COUNT" -eq 0 ] || { echo "::error::actionabilityCacheForReliance=true found!"; exit 1; }
          echo "TRUST_LAW_STATIC=PASS"

      - name: M2 security assertions
        run: |
          # Bearer auth must be used (not internal token)
          grep -q 'Authorization.*Bearer' lib/core/network/api_client.dart || \
            { echo "::error::Bearer auth not found in api_client.dart"; exit 1; }
          # x-pv-internal-token must NOT be in the consumer client
          COUNT=$(grep -E 'x-pv-internal-token' lib/core/network/api_client.dart | wc -l)
          [ "$COUNT" -eq 0 ] || \
            { echo "::error::x-pv-internal-token found in consumer api_client!"; exit 1; }
          # pv.machine-trust.v1 schema expected
          grep -q 'pv.machine-trust.v1' lib/trust/machine_trust_response.dart || \
            { echo "::error::pv.machine-trust.v1 schema not found"; exit 1; }
          # Trust state digest extracted from header
          grep -q 'x-pv-trust-state-digest' lib/core/network/api_client.dart || \
            { echo "::error::x-pv-trust-state-digest header extraction missing"; exit 1; }
          echo "M2_SECURITY_ASSERTIONS=PASS"

      - name: UNQUALIFIED_T1_OVERCLAIM = ZERO assertion
        run: |
          # safeTier must be null when not eligible
          grep -q 'UNQUALIFIED' test/unit/machine_trust_response_test.dart || \
            { echo "::error::UNQUALIFIED_T1_OVERCLAIM test missing"; exit 1; }
          echo "UNQUALIFIED_T1_OVERCLAIM_ZERO=PASS"

      - name: Secret scan — source
        run: |
          PATTERNS='sk_live_|rk_live_|sk_test_|service_role|BEGIN RSA PRIVATE|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY|pv_live_[a-z0-9]{32,}'
          COUNT=$(grep -rEI "$PATTERNS" lib/ test/ pubspec.yaml 2>/dev/null | \
            grep -v '//.*ignore\|#.*ignore\|_test_key_for_qual_only' | wc -l || echo 0)
          echo "Source secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in source!"; exit 1; }
          echo "SECRETS_IN_SOURCE=ZERO"

      - name: Build Android AAB (qualification release)
        run: |
          flutter build appbundle --release \
            --flavor qualification \
            --dart-define=ENVIRONMENT=qualification \
            --dart-define=PV_API_BASE_URL=${{ env.PV_API_BASE_URL }}

      - name: Compute Android AAB SHA256
        id: aab_hash
        run: |
          AAB=build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          [ -f "$AAB" ] || { echo "::error::AAB not found: $AAB"; exit 1; }
          HASH=$(sha256sum "$AAB" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$AAB")
          echo "android_aab_sha256=$HASH" >> $GITHUB_OUTPUT
          echo "android_aab_size=$SIZE" >> $GITHUB_OUTPUT
          echo "Android AAB SHA256: $HASH"
          echo "Android AAB size:   $SIZE bytes"

      - name: Secret scan — Android AAB
        run: |
          AAB=build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          mkdir -p /tmp/aab-scan
          unzip -o "$AAB" -d /tmp/aab-scan 2>/dev/null || true
          PATTERNS='sk_live_|rk_live_|service_role|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY'
          COUNT=$(find /tmp/aab-scan -type f -name "*.dex" \
            -exec strings {} \; 2>/dev/null | \
            grep -E "$PATTERNS" 2>/dev/null | wc -l)
          echo "AAB secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in Android AAB!"; exit 1; }
          echo "SECRETS_IN_ANDROID_ARTIFACT=ZERO"
          rm -rf /tmp/aab-scan

      - name: Package identity assertions
        run: |
          grep -q 'applicationId = "to.veritan.pv"' android/app/build.gradle.kts || \
            { echo "::error::Production app ID missing"; exit 1; }
          grep -q 'applicationId = "to.veritan.pv.qual"' android/app/build.gradle.kts || \
            { echo "::error::Qualification app ID missing"; exit 1; }
          grep -q 'applicationId = "to.veritan.pv.dev"' android/app/build.gradle.kts || \
            { echo "::error::Development app ID missing"; exit 1; }
          echo "PACKAGE_IDENTITY=PASS"

      - name: Eight-stone binding assert
        run: |
          grep -q 'STONE-1' test/unit/eight_stone_parity_test.dart || \
            { echo "::error::STONE-1 binding missing"; exit 1; }
          grep -q 'STONE-8' test/unit/eight_stone_parity_test.dart || \
            { echo "::error::STONE-8 binding missing"; exit 1; }
          STONE_COUNT=$(grep -oE "STONE-[0-9]:" test/unit/eight_stone_parity_test.dart | \
            sort -u | wc -l)
          echo "Eight-stone groups: $STONE_COUNT"
          [ "$STONE_COUNT" -ge 8 ] || \
            { echo "::error::Expected 8 stone groups, found $STONE_COUNT"; exit 1; }
          echo "EIGHT_STONE_PARITY=8/8"

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: pv-mobile-m2-android-qualification-aab
          path: build/app/outputs/bundle/qualificationRelease/app-qualification-release.aab
          retention-days: 30

      - name: Upload Linux test output
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-linux
          path: flutter-test-linux.txt
          retention-days: 30

  macos-ios:
    name: 'macOS — Analyze + Unit Tests + iOS Build'
    runs-on: macos-latest
    outputs:
      ios_archive_sha256: ${{ steps.ios_hash.outputs.ios_archive_sha256 }}
      ios_archive_size: ${{ steps.ios_hash.outputs.ios_archive_size }}
      xcode_version: ${{ steps.versions.outputs.xcode_version }}
      dart_version: ${{ steps.versions.outputs.dart_version }}
      test_count: ${{ steps.flutter_test.outputs.test_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print versions
        id: versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          echo "xcode_version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')" >> $GITHUB_OUTPUT

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee flutter-analyze-macos.txt
          grep -q "No issues found" flutter-analyze-macos.txt || \
            { echo "::error::flutter analyze found issues"; exit 1; }
          echo "FLUTTER_ANALYZE_MACOS=PASS"

      - name: flutter test — unit tests (assert exactly 172)
        id: flutter_test
        run: |
          flutter test test/unit/ --reporter expanded 2>&1 | tee flutter-test-macos.txt
          grep -q "All tests passed" flutter-test-macos.txt || \
            { echo "::error::flutter test: not all tests passed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-macos.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "Detected unit test count: $TEST_COUNT"
          [ "$TEST_COUNT" = "${{ env.EXPECTED_M2_UNIT_COUNT }}" ] || \
            { echo "::error::Expected ${{ env.EXPECTED_M2_UNIT_COUNT }} tests, got $TEST_COUNT"; exit 1; }
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "FLUTTER_TESTS_MACOS=PASS ($TEST_COUNT/${{ env.EXPECTED_M2_UNIT_COUNT }})"

      - name: Build iOS (release, no-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=PV_API_BASE_URL=${{ env.PV_API_BASE_URL }}

      - name: Archive Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r runner-app-m2.zip Runner.app
          ls -lh runner-app-m2.zip

      - name: Compute iOS archive SHA256
        id: ios_hash
        run: |
          ARCHIVE=build/ios/iphoneos/runner-app-m2.zip
          [ -f "$ARCHIVE" ] || { echo "::error::iOS archive not found"; exit 1; }
          HASH=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)
          SIZE=$(stat -f%z "$ARCHIVE")
          echo "ios_archive_sha256=$HASH" >> $GITHUB_OUTPUT
          echo "ios_archive_size=$SIZE" >> $GITHUB_OUTPUT
          echo "iOS archive SHA256: $HASH"
          echo "iOS archive size:   $SIZE bytes"

      - name: Secret scan — iOS artifact
        run: |
          PATTERNS='sk_live_|rk_live_|service_role|BEGIN PRIVATE KEY|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY'
          COUNT=$(strings build/ios/iphoneos/Runner.app/Runner 2>/dev/null | \
            grep -E "$PATTERNS" 2>/dev/null | wc -l)
          echo "iOS secrets: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::Secrets found in iOS artifact!"; exit 1; }
          echo "SECRETS_IN_IOS_ARTIFACT=ZERO"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pv-mobile-m2-ios-nocodesign-app
          path: build/ios/iphoneos/runner-app-m2.zip
          retention-days: 30

      - name: Upload macOS test output
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-macos
          path: flutter-test-macos.txt
          retention-days: 30

  real-backend-integration:
    name: 'Real Backend Integration Tests'
    runs-on: ubuntu-latest
    # Only runs when PV_API_KEY secret is set.
    # Without the secret, this job is a documented human-only boundary.
    if: ${{ vars.PV_QUAL_BACKEND_ENABLED == 'true' }}
    outputs:
      integration_gate: ${{ steps.int_gate.outputs.integration_gate }}
      m2_int_test_count: ${{ steps.int_test.outputs.m2_int_test_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Real backend integration tests (M2-INT-01 to M2-INT-08)
        id: int_test
        env:
          PV_API_KEY: ${{ secrets.PV_QUAL_API_KEY }}
          PV_TENANT_ID: ${{ secrets.PV_QUAL_TENANT_ID }}
          PV_QUAL_SUBJECT_ID: ${{ vars.PV_QUAL_SUBJECT_ID }}
        run: |
          flutter test test/integration/ --reporter expanded \
            --dart-define=PV_API_BASE_URL=${{ env.PV_API_BASE_URL }} \
            --dart-define=PV_API_KEY=$PV_API_KEY \
            --dart-define=PV_TENANT_ID=$PV_TENANT_ID \
            --dart-define=PV_QUAL_SUBJECT_ID=$PV_QUAL_SUBJECT_ID \
            2>&1 | tee flutter-test-integration.txt
          grep -q "All tests passed" flutter-test-integration.txt || \
            { echo "::error::Integration tests failed"; exit 1; }
          TEST_COUNT=$(grep ': All tests passed!' flutter-test-integration.txt | \
            grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          echo "m2_int_test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "M2_REAL_BACKEND_INTEGRATION=PASS ($TEST_COUNT tests)"

      - name: Integration gate assertion
        id: int_gate
        run: |
          echo "integration_gate=PASS" >> $GITHUB_OUTPUT
          echo "M2_INT_GATE=PASS"

      - name: Upload integration test output
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output-integration
          path: flutter-test-integration.txt
          retention-days: 30

  evidence:
    name: 'Evidence Assembly'
    needs: [linux-android, macos-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Verify downloaded artifact hashes
        run: |
          ANDROID_ACTUAL=$(sha256sum \
            artifacts/pv-mobile-m2-android-qualification-aab/app-qualification-release.aab \
            | cut -d' ' -f1)
          ANDROID_EXPECTED="${{ needs.linux-android.outputs.android_aab_sha256 }}"
          echo "Android AAB: expected=$ANDROID_EXPECTED actual=$ANDROID_ACTUAL"
          [ "$ANDROID_ACTUAL" = "$ANDROID_EXPECTED" ] || \
            { echo "::error::Android AAB hash mismatch!"; exit 1; }

          IOS_ACTUAL=$(sha256sum \
            artifacts/pv-mobile-m2-ios-nocodesign-app/runner-app-m2.zip \
            | cut -d' ' -f1)
          IOS_EXPECTED="${{ needs.macos-ios.outputs.ios_archive_sha256 }}"
          echo "iOS archive: expected=$IOS_EXPECTED actual=$IOS_ACTUAL"
          [ "$IOS_ACTUAL" = "$IOS_EXPECTED" ] || \
            { echo "::error::iOS archive hash mismatch!"; exit 1; }

          echo "DOWNLOADED_HASH_MATCH=PASS"

      - name: Generate mobile-m2-ci-evidence.json
        run: |
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > mobile-m2-ci-evidence.json << ENDJSON
          {
            "schema": "pv.mobile-ci-evidence.m2.v1",
            "m2_head_sha": "${{ needs.linux-android.outputs.head_sha }}",
            "m1_ancestry_sha": "82ad06a",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "$WORKFLOW_URL",
            "workflow_sha": "${{ github.sha }}",
            "flutter_version": "${{ needs.linux-android.outputs.flutter_version }}",
            "dart_version_linux": "${{ needs.linux-android.outputs.dart_version }}",
            "dart_version_macos": "${{ needs.macos-ios.outputs.dart_version }}",
            "java_version": "${{ needs.linux-android.outputs.java_version }}",
            "xcode_version": "${{ needs.macos-ios.outputs.xcode_version }}",
            "pubspec_lock_sha256": "${{ needs.linux-android.outputs.pubspec_lock_sha256 }}",
            "linux_flutter_analyze": "PASS",
            "linux_flutter_test_unit": "PASS",
            "linux_unit_test_count": ${{ needs.linux-android.outputs.test_count }},
            "android_build": "PASS",
            "android_flavor": "qualification",
            "android_aab_sha256": "${{ needs.linux-android.outputs.android_aab_sha256 }}",
            "android_aab_size_bytes": ${{ needs.linux-android.outputs.android_aab_size }},
            "macos_flutter_analyze": "PASS",
            "macos_flutter_test_unit": "PASS",
            "macos_unit_test_count": ${{ needs.macos-ios.outputs.test_count }},
            "ios_build": "PASS",
            "ios_codesign": false,
            "ios_archive_sha256": "${{ needs.macos-ios.outputs.ios_archive_sha256 }}",
            "ios_archive_size_bytes": ${{ needs.macos-ios.outputs.ios_archive_size }},
            "source_secret_scan": "ZERO",
            "android_secret_scan": "ZERO",
            "ios_secret_scan": "ZERO",
            "m2_security_assertions": "PASS",
            "bearer_auth": "PASS",
            "internal_token_absent": "PASS",
            "trust_state_digest_from_header": "PASS",
            "unqualified_t1_overclaim": "ZERO",
            "package_identity": {
              "prod": "to.veritan.pv",
              "qual": "to.veritan.pv.qual",
              "dev": "to.veritan.pv.dev",
              "result": "PASS"
            },
            "trust_law": {
              "money_controls_trust": false,
              "actionability_cache_for_reliance": false,
              "result": "PASS"
            },
            "real_backend": {
              "url": "${{ env.PV_API_BASE_URL }}",
              "api_key_source": "PV_QUAL_API_KEY (GitHub secret)",
              "integration_gate": "PENDING_CREDENTIAL_PROVISIONING"
            },
            "eight_stone_binding": "PASS",
            "downloaded_android_hash_match": "PASS",
            "downloaded_ios_hash_match": "PASS",
            "pv_backend_mutations": "ZERO",
            "production_mutations": "ZERO",
            "v4_activated": "NO",
            "workflow_conclusion": "SUCCESS"
          }
          ENDJSON
          cat mobile-m2-ci-evidence.json

      - name: Generate checksum manifest
        run: |
          sha256sum \
            artifacts/pv-mobile-m2-android-qualification-aab/app-qualification-release.aab \
            artifacts/pv-mobile-m2-ios-nocodesign-app/runner-app-m2.zip \
            mobile-m2-ci-evidence.json \
            > checksum-manifest-m2.txt
          cat checksum-manifest-m2.txt
          echo "HASH_MISMATCHES=ZERO"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m2-ci-evidence
          path: |
            mobile-m2-ci-evidence.json
            checksum-manifest-m2.txt
          retention-days: 90
