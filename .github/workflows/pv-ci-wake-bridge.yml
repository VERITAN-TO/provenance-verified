name: PV Native Route 2 CI Wake Bridge — DORMANT

# ROUTE 2 IS PRESERVED FOR RECOVERY HISTORY ONLY.
# ROUTE 1 persistent Lead-C session is the sole active native execution route.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dormant:
    runs-on: ubuntu-latest
    steps:
      - name: Route 2 dormant receipt
        run: |
          echo "PV_ROUTE_2_STATE=DORMANT"
          echo "PV_ACTIVE_EXECUTION_ROUTE=ROUTE_1"
          echo "NO_LANE_DISPATCH_PERFORMED=YES"
